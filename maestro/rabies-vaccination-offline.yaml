# 35b, offline: the ACS vaccinates the dog of the download against rabies, with no adverse event. The reference's only
# rabies product comes chosen, and the campaign is the open one. The vaccination waits on the tablet; one sync sends it.
appId: br.rotasaude.campo
---
- runScript:
    file: scripts/server.js
    env:
      ACTION: reset
- runScript:
    file: scripts/server.js
    env:
      ACTION: script
      BODY: '{ "zoonoses": true }'
- runFlow: common/pair.yaml
- setAirplaneMode: enabled
- scrollUntilVisible:
    element: "Domicílios"
    centerElement: true
- tapOn: "Domicílios"
- tapOn: ".*Flores, 120.*"
# The section sits below the fold of the household's detail.
- scrollUntilVisible:
    element: "Animais"
    timeout: 60000
# The household has another dog (the community one) with its own "Vacinar": the button is the one below this card's name.
- scrollUntilVisible:
    element: "Cão · Pipoca"
    centerElement: true
- tapOn:
    text: "Vacinar"
    below: "Cão · Pipoca"
- extendedWaitUntil:
    visible: "Campanha: .*"
    timeout: 30000
- assertVisible: "Evento adverso"
# To the end of the form: the last button sits behind the task bar until then. Scrolling takes the animal's name out of
# the tree, so the anchor is "Evento adverso": the title has the same words as the button, and the button is below it.
- scroll
- tapOn:
    text: "Vacinar"
    below: "Evento adverso"
- extendedWaitUntil:
    visible: "Aguardando envio"
    timeout: 30000
- assertVisible: "Aguardando envio"
- repeat:
    while:
      notVisible: "Sincronizar"
    times: 3
    commands:
      - back
- extendedWaitUntil:
    visible: "Pendentes de envio: 1"
    timeout: 30000
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "Sincronizar"
    timeout: 30000
- tapOn: "Sincronizar"
- extendedWaitUntil:
    visible: "Pendentes de envio: 0"
    timeout: 60000
- assertVisible: "Precisam de atenção: 0"
- runScript:
    file: scripts/expect-zoonoses.js
    env:
      EXPECT: '{ "vaccinations": 1 }'
