# 35b, offline: the endemic agent collects blood from the dog of the download, in the survey that lists the household
# (the only one: it comes chosen), TR-DPP non-reactive. The collection shows "Etiqueta depois de enviar" until the api
# gives the label with the acceptance (Q21): after the sync, Today shows "LV-2026-…" (the double fixes the year).
appId: br.rotasaude.campo
---
- runScript:
    file: scripts/server.js
    env:
      ACTION: reset
- runScript:
    file: scripts/server.js
    env:
      ACTION: script
      BODY: '{ "profile": "ace" }'
- runScript:
    file: scripts/server.js
    env:
      ACTION: script
      BODY: '{ "zoonoses": true }'
- runFlow: common/pair-ace.yaml
- setAirplaneMode: enabled
- scrollUntilVisible:
    element: "Domicílios"
    centerElement: true
- tapOn: "Domicílios"
- tapOn: ".*Flores, 120.*"
# The section sits below the fold of the household's detail.
- scrollUntilVisible:
    element: "Animais"
    timeout: 60000
- scrollUntilVisible:
    element: "Cão · Pipoca"
    centerElement: true
- tapOn:
    text: "Coletar sangue \\(LV\\)"
    below: "Cão · Pipoca"
- extendedWaitUntil:
    visible: "Inquérito"
    timeout: 30000
- scrollUntilVisible:
    element: "Não reagente"
    centerElement: true
- tapOn: "Não reagente"
# To the end of the form: the last button sits behind the task bar until then. Scrolling takes the animal's name out of the
# tree, so the anchor is the last field: the title has the same words as the button, and the button is below it.
- scroll
- tapOn:
    text: "Coletar sangue \\(LV\\)"
    below: "Resultado do TR-DPP"
# Saved on the tablet: the card says the label comes after the sending, and shows no label of the app's own.
- extendedWaitUntil:
    visible: "Etiqueta depois de enviar"
    timeout: 30000
- assertVisible: "Aguardando envio"
- repeat:
    while:
      notVisible: "Sincronizar"
    times: 3
    commands:
      - back
# The Home kept the scroll that took "Domicílios" into sight: the counters are above it, out of the tree until scrolled back.
- scrollUntilVisible:
    element: "Pendentes de envio: 1"
    direction: UP
    timeout: 60000
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "Sincronizar"
    timeout: 30000
- tapOn: "Sincronizar"
- extendedWaitUntil:
    visible: "Pendentes de envio: 0"
    timeout: 60000
- assertVisible: "Precisam de atenção: 0"
- runScript:
    file: scripts/expect-zoonoses.js
    env:
      EXPECT: '{ "collections": 1 }'
# The api's label, now on the day's list.
- scrollUntilVisible:
    element: "Minhas visitas de hoje"
- tapOn: "Minhas visitas de hoje"
- extendedWaitUntil:
    visible: "Etiqueta: LV-2026-.*"
    timeout: 30000
